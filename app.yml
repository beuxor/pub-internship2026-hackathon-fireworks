install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

profile:
  label: "楽天市場パーセントバルーン"
  description: "EC購買データから自動生成した割合(%)を当てるクイズゲーム"
  icon: "public/icon.svg"
